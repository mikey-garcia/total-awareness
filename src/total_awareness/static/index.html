<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Total Awareness</title><style>body{font-family:ui-monospace,monospace;background:#07110d;color:#e8fff2;margin:0;padding:24px}pre{white-space:pre-wrap;background:#0b1b14;padding:16px;border-radius:12px}</style></head><body><h1>Total Awareness</h1><pre id="world">loading…</pre><script>async function refresh(){const r=await fetch('/api/snapshot');world.textContent=JSON.stringify(await r.json(),null,2)}refresh();const p=location.protocol==='https:'?'wss':'ws';const w=new WebSocket(`${p}://${location.host}/ws`);w.onmessage=e=>world.textContent=JSON.stringify(JSON.parse(e.data),null,2)</script></body></html>
