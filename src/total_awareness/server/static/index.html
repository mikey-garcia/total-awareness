<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07110d" />
  <title>Total Awareness</title>
  <style>
    :root { color-scheme:dark; --bg:#07110d; --panel:#0b1b14; --text:#e8fff2; --muted:#83a894; --line:rgba(137,255,189,.18); --hot:#8fffb8; --warn:#ffd978; --safe:max(16px,env(safe-area-inset-left)); }
    *{box-sizing:border-box} body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.shell{max-width:760px;margin:auto;padding-bottom:40px}header{padding:calc(14px + env(safe-area-inset-top)) var(--safe) 12px;border-bottom:1px solid var(--line)}.brand,.entity-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{margin:0;font-size:15px;letter-spacing:.16em}.live{color:var(--muted);font-size:11px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.metric,.entity{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px}.metric strong{display:block;font-size:17px}.metric span,.section-title,.entity-meta{color:var(--muted);font-size:9px}.section-title{margin:18px 2px 8px;letter-spacing:.12em;text-transform:uppercase}main{padding:12px var(--safe)}.radar-card{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden}#radar{display:block;width:100%;aspect-ratio:1/1}.legend{position:absolute;left:10px;bottom:9px;color:var(--muted);font-size:9px}.legend b{color:var(--text)}#entities{display:grid;gap:8px}.entity{width:100%;text-align:left;color:inherit;font:inherit}.confidence{color:var(--hot);font-size:11px}.entity-meta{margin-top:5px}.empty{color:var(--muted);text-align:center;padding:24px;font-size:11px}dialog{width:min(92vw,560px);border:1px solid var(--line);border-radius:16px;background:#0b1b14;color:var(--text);padding:14px}.close{float:right;background:none;border:0;color:var(--muted);font-size:18px}
  </style>
</head>
<body><div class="shell"><header><div class="brand"><h1>TOTAL AWARENESS</h1><div class="live" id="status">CONNECTING</div></div><div class="summary"><div class="metric"><strong id="total">0</strong><span>entities</span></div><div class="metric"><strong id="cameras">0</strong><span>cameras</span></div><div class="metric"><strong id="rf">0</strong><span>RF</span></div><div class="metric"><strong id="unknown">0</strong><span>unknown</span></div></div></header><main><div class="radar-card"><canvas id="radar" width="700" height="700"></canvas><div class="legend"><b>solid</b> localized · <b>dashed</b> RF proximity only</div></div><div class="section-title">World model</div><div id="entities"></div></main></div><dialog id="drawer"><button class="close" id="close">×</button><div id="detail"></div></dialog>
<script>
const S={entities:[],observer:null,counts:{}}; const canvas=document.getElementById('radar'),ctx=canvas.getContext('2d'),drawer=document.getElementById('drawer');
const glyph=k=>({camera:'CAM',access_point:'AP',rf_device:'RF',presence_region:'PRES'}[k]||'?');
const observer=()=>S.observer?.position||{x:0,y:0};
const relative=e=>e.position?{x:e.position.x-observer().x,y:e.position.y-observer().y}:null;
function proximity(rssi){ if(rssi==null)return .88; if(rssi>=-50)return .28; if(rssi>=-65)return .48; if(rssi>=-78)return .68; return .88; }
function stableAngle(e){ const s=e.id||''; let h=2166136261; for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)} return ((h>>>0)%360)*Math.PI/180; }
function draw(){const d=window.devicePixelRatio||1,r=canvas.getBoundingClientRect(),n=Math.max(320,Math.floor(r.width*d));canvas.width=n;canvas.height=n;const c=n/2,R=n*.43;ctx.fillStyle='#08140f';ctx.fillRect(0,0,n,n);ctx.strokeStyle='rgba(143,255,184,.16)';ctx.lineWidth=d;for(let i=1;i<=4;i++){ctx.beginPath();ctx.arc(c,c,R*i/4,0,7);ctx.stroke()}const localized=S.entities.filter(e=>e.kind!=='observer'&&e.position);const max=Math.max(10,...localized.map(e=>{const p=relative(e);return Math.hypot(p.x,p.y)}))*1.22;for(const e of S.entities.filter(e=>e.kind!=='observer')){let x,y,unlocated=!e.position;if(unlocated){const a=stableAngle(e),rad=R*proximity(e.attributes?.signal_dbm);x=c+Math.cos(a)*rad;y=c+Math.sin(a)*rad}else{const p=relative(e),scale=R/max;x=c+p.x*scale;y=c-p.y*scale}ctx.save();ctx.fillStyle=e.kind==='camera'? '#ffd978':'#8fffb8';ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=2*d;if(unlocated){ctx.setLineDash([4*d,4*d]);ctx.beginPath();ctx.arc(x,y,7*d,0,7);ctx.stroke()}else{ctx.beginPath();ctx.arc(x,y,5*d,0,7);ctx.fill()}ctx.restore();ctx.fillStyle='#e8fff2';ctx.font=`${9*d}px ui-monospace`;const sig=e.attributes?.signal_dbm!=null?` ${e.attributes.signal_dbm}dBm`:'';ctx.fillText(`${glyph(e.kind)}${sig}`,x+9*d,y-6*d)}ctx.fillStyle='#8fffb8';ctx.beginPath();ctx.arc(c,c,7*d,0,7);ctx.fill();ctx.fillStyle='#e8fff2';ctx.font=`bold ${9*d}px ui-monospace`;ctx.fillText('YOU',c+11*d,c+3*d)}
function render(x){Object.assign(S,x);for(const k of ['total','cameras','rf','unknown'])document.getElementById(k).textContent=x.counts?.[k]??0;const list=document.getElementById('entities');const es=x.entities.filter(e=>e.kind!=='observer');list.innerHTML=es.length?'':'<div class="empty">No inferred entities yet.</div>';for(const e of es){const b=document.createElement('button');b.className='entity';const sig=e.attributes?.signal_dbm!=null?`${e.attributes.signal_dbm} dBm`:'no RSSI';const where=e.position?'localized':'unlocalized';b.innerHTML=`<div class="entity-top"><b>${glyph(e.kind)} · ${e.attributes?.name||e.attributes?.manufacturer||e.kind}</b><span class="confidence">${Math.round(e.confidence*100)}%</span></div><div class="entity-meta">${e.id} · ${where} · ${sig}</div>`;b.onclick=()=>openEntity(e.id);list.appendChild(b)}draw()}
async function openEntity(id){const r=await fetch(`/entities/${id}`);if(!r.ok)return;const d=await r.json(),e=d.entity;document.getElementById('detail').innerHTML=`<b>${glyph(e.kind)} · ${e.id}</b><p>${e.kind} · ${Math.round(e.confidence*100)}% confidence</p><p>${e.position?'Localized position available':'Position unknown — radar radius is RSSI proximity only; angle is not a bearing.'}</p><div class="section-title">Evidence</div>`+d.observations.map(o=>`<p class="entity-meta">${o.modality} / ${o.type} · ${o.sensor_id}</p>`).join('');drawer.showModal()}
document.getElementById('close').onclick=()=>drawer.close();window.addEventListener('resize',draw);fetch('/api/snapshot').then(r=>r.json()).then(render);function connect(){const p=location.protocol==='https:'?'wss':'ws',w=new WebSocket(`${p}://${location.host}/ws`);w.onopen=()=>status.textContent='LIVE';w.onmessage=e=>render(JSON.parse(e.data));w.onclose=()=>{status.textContent='RECONNECTING';setTimeout(connect,1200)}}connect();
</script></body></html>
