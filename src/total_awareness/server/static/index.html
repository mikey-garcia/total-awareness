<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07110d" />
  <title>Total Awareness</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07110d;
      --panel: rgba(11, 27, 20, 0.92);
      --panel-2: rgba(17, 40, 29, 0.88);
      --text: #e8fff2;
      --muted: #83a894;
      --line: rgba(137, 255, 189, 0.18);
      --hot: #8fffb8;
      --warn: #ffd978;
      --danger: #ff8c8c;
      --safe: max(16px, env(safe-area-inset-left));
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% -15%, rgba(71, 184, 118, .15), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-x: hidden;
    }
    .shell { max-width: 760px; margin: 0 auto; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    header {
      position: sticky; top: 0; z-index: 5;
      padding: calc(14px + env(safe-area-inset-top)) var(--safe) 12px;
      background: linear-gradient(180deg, rgba(7,17,13,.98), rgba(7,17,13,.80));
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .brand h1 { margin:0; font-size:15px; letter-spacing:.16em; }
    .live { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--warn); box-shadow:0 0 12px currentColor; }
    .dot.up { background:var(--hot); }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:12px; }
    .metric { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; }
    .metric strong { display:block; font-size:17px; }
    .metric span { color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.08em; }
    main { padding: 12px var(--safe); }
    .radar-card { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
    #radar { display:block; width:100%; aspect-ratio:1/1; max-height:60dvh; }
    .range { position:absolute; right:12px; bottom:10px; color:var(--muted); font-size:10px; }
    .section-title { margin:18px 2px 8px; color:var(--muted); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
    #entities { display:grid; gap:8px; }
    .entity {
      width:100%; text-align:left; color:inherit; font:inherit;
      background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:11px 12px;
    }
    .entity-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .entity-name { font-weight:700; font-size:12px; }
    .confidence { color:var(--hot); font-size:11px; }
    .entity-meta { color:var(--muted); font-size:10px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    dialog {
      width:min(92vw, 560px); border:1px solid var(--line); border-radius:16px;
      background:#0b1b14; color:var(--text); padding:0; box-shadow:0 24px 90px #000b;
    }
    dialog::backdrop { background:#0009; backdrop-filter:blur(3px); }
    .drawer-head { display:flex; justify-content:space-between; padding:14px; border-bottom:1px solid var(--line); }
    .drawer-body { padding:14px; max-height:65dvh; overflow:auto; }
    .close { background:transparent; border:0; color:var(--muted); font:inherit; font-size:18px; }
    .evidence { padding:8px 0; border-bottom:1px solid var(--line); font-size:10px; }
    .empty { color:var(--muted); text-align:center; padding:26px 10px; font-size:11px; }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <h1>TOTAL AWARENESS</h1>
      <div class="live"><span id="statusDot" class="dot"></span><span id="status">CONNECTING</span></div>
    </div>
    <div class="summary">
      <div class="metric"><strong id="countTotal">0</strong><span>entities</span></div>
      <div class="metric"><strong id="countCameras">0</strong><span>cameras</span></div>
      <div class="metric"><strong id="countRf">0</strong><span>RF</span></div>
      <div class="metric"><strong id="countUnknown">0</strong><span>unknown</span></div>
    </div>
  </header>
  <main>
    <div class="radar-card">
      <canvas id="radar" width="700" height="700"></canvas>
      <div class="range">AUTO RANGE</div>
    </div>
    <div class="section-title">World model</div>
    <div id="entities"><div class="empty">Waiting for observations…</div></div>
  </main>
</div>
<dialog id="drawer">
  <div class="drawer-head"><strong id="drawerTitle">ENTITY</strong><button class="close" id="closeDrawer">×</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</dialog>
<script>
  const state = { snapshot: { entities: [], observer: null, counts: {} } };
  const radar = document.getElementById('radar');
  const ctx = radar.getContext('2d');
  const drawer = document.getElementById('drawer');

  function observerPosition() {
    return state.snapshot.observer?.position || {x: 0, y: 0, z: 0};
  }

  function relative(entity) {
    if (!entity.position) return null;
    const o = observerPosition();
    return {x: entity.position.x - o.x, y: entity.position.y - o.y};
  }

  function entityGlyph(kind) {
    if (kind === 'camera') return 'CAM';
    if (kind === 'access_point') return 'AP';
    if (kind === 'observer') return 'YOU';
    if (kind === 'presence_region') return 'PRES';
    if (kind === 'rf_device') return 'RF';
    return '?';
  }

  function maxRange(entities) {
    const distances = entities.map(relative).filter(Boolean).map(p => Math.hypot(p.x,p.y));
    return Math.max(10, ...distances) * 1.22;
  }

  function drawRadar() {
    const dpr = window.devicePixelRatio || 1;
    const rect = radar.getBoundingClientRect();
    const size = Math.max(320, Math.floor(rect.width * dpr));
    if (radar.width !== size || radar.height !== size) { radar.width = size; radar.height = size; }
    const w = radar.width, h = radar.height, cx = w/2, cy = h/2;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#08140f'; ctx.fillRect(0,0,w,h);
    const entities = state.snapshot.entities.filter(e => e.kind !== 'observer' && e.position);
    const range = maxRange(entities);
    ctx.strokeStyle = 'rgba(143,255,184,.16)'; ctx.lineWidth = Math.max(1,dpr);
    for (let i=1;i<=4;i++) { ctx.beginPath(); ctx.arc(cx,cy,(w*.43)*(i/4),0,Math.PI*2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(cx, h*.07); ctx.lineTo(cx,h*.93); ctx.moveTo(w*.07,cy); ctx.lineTo(w*.93,cy); ctx.stroke();
    const scale = (w*.43)/range;
    for (const e of entities) {
      const p = relative(e); const x = cx + p.x*scale; const y = cy - p.y*scale;
      const hot = e.kind === 'camera';
      ctx.fillStyle = hot ? '#ffd978' : '#8fffb8';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12*dpr;
      ctx.beginPath(); ctx.arc(x,y,5*dpr,0,Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#e8fff2'; ctx.font = `${9*dpr}px ui-monospace, monospace`;
      ctx.fillText(`${entityGlyph(e.kind)} ${e.id}`, x+8*dpr, y-7*dpr);
    }
    ctx.fillStyle = '#8fffb8'; ctx.shadowColor='#8fffb8'; ctx.shadowBlur=16*dpr;
    ctx.beginPath(); ctx.arc(cx,cy,7*dpr,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#e8fff2'; ctx.font=`bold ${9*dpr}px ui-monospace, monospace`; ctx.fillText('YOU',cx+11*dpr,cy+3*dpr);
  }

  function renderEntities() {
    const list = document.getElementById('entities');
    const entities = state.snapshot.entities.filter(e => e.kind !== 'observer');
    if (!entities.length) { list.innerHTML = '<div class="empty">No inferred entities yet.</div>'; return; }
    list.innerHTML = '';
    for (const e of entities) {
      const button = document.createElement('button'); button.className='entity';
      const p = relative(e); const distance = p ? `${Math.hypot(p.x,p.y).toFixed(1)}m` : 'position unknown';
      button.innerHTML = `<div class="entity-top"><span class="entity-name">${entityGlyph(e.kind)} · ${e.id}</span><span class="confidence">${Math.round(e.confidence*100)}%</span></div><div class="entity-meta">${e.kind} · ${distance} · evidence ${e.evidence.length}</div>`;
      button.onclick = () => openEntity(e.id); list.appendChild(button);
    }
  }

  function render(snapshot) {
    state.snapshot = snapshot;
    document.getElementById('countTotal').textContent = snapshot.counts?.total ?? 0;
    document.getElementById('countCameras').textContent = snapshot.counts?.cameras ?? 0;
    document.getElementById('countRf').textContent = snapshot.counts?.rf ?? 0;
    document.getElementById('countUnknown').textContent = snapshot.counts?.unknown ?? 0;
    drawRadar(); renderEntities();
  }

  async function openEntity(id) {
    const res = await fetch(`/entities/${id}`); if (!res.ok) return;
    const data = await res.json(); const e = data.entity;
    document.getElementById('drawerTitle').textContent = `${entityGlyph(e.kind)} · ${e.id}`;
    const evidence = data.observations.map(o => `<div class="evidence"><strong>${o.modality} / ${o.type}</strong><br>sensor ${o.sensor_id} · confidence ${Math.round(o.confidence*100)}%<br>${new Date(o.timestamp).toLocaleTimeString()}</div>`).join('');
    document.getElementById('drawerBody').innerHTML = `<div style="font-size:11px;line-height:1.7"><strong>${e.kind}</strong> · confidence ${Math.round(e.confidence*100)}%<br>first seen ${new Date(e.first_seen).toLocaleTimeString()}<br>last seen ${new Date(e.last_seen).toLocaleTimeString()}<br>aliases ${(e.aliases || []).join(', ') || 'none'}</div><div class="section-title">Evidence</div>${evidence || '<div class="empty">No evidence</div>'}`;
    drawer.showModal();
  }

  document.getElementById('closeDrawer').onclick = () => drawer.close();
  window.addEventListener('resize', drawRadar);

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => { document.getElementById('status').textContent='LIVE'; document.getElementById('statusDot').classList.add('up'); };
    ws.onmessage = e => render(JSON.parse(e.data));
    ws.onclose = () => { document.getElementById('status').textContent='RECONNECTING'; document.getElementById('statusDot').classList.remove('up'); setTimeout(connect, 1200); };
    ws.onerror = () => ws.close();
  }

  fetch('/api/snapshot').then(r => r.json()).then(render).catch(() => {});
  connect();
</script>
</body>
</html>
