<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <title>Total Awareness</title>
</head>
<body>
  <main class="shell">
    <header>
      <div><span class="eyebrow">TOTAL</span><h1>AWARENESS</h1></div>
      <span id="live" class="status">CONNECTING</span>
    </header>

    <section class="overview panel">
      <div><strong id="total">—</strong><span>ENTITIES</span></div>
      <div><strong id="rf">—</strong><span>WI-FI</span></div>
      <div><strong id="sources">—</strong><span>SOURCES</span></div>
    </section>

    <section class="panel">
      <div class="section-head"><h2>NOTIFICATIONS</h2><span id="push-status">OFF</span></div>
      <div class="actions">
        <button id="enable-push">ENABLE</button>
        <button id="test-push" class="secondary" disabled>TEST PUSH</button>
      </div>
      <p class="hint">On iPhone, install this page to the Home Screen before enabling push.</p>
    </section>

    <section class="panel entities-panel">
      <div class="section-head"><h2>ENTITIES</h2><span id="updated">—</span></div>
      <div id="entities" class="entities"><p class="muted">Loading…</p></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
