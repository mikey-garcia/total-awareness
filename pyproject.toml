[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "total-awareness"
version = "0.1.0"
description = "Portable multimodal situational-awareness research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
ta = "total_awareness.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
