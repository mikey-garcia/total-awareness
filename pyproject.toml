[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "total-awareness"
version = "0.1.0"
description = "Small sensor observation and HUD experiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "rich>=13.7,<14"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pywebpush>=2,<3"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
ta = "cli:app"

[tool.setuptools]
py-modules = ["app", "cli", "core", "db", "protocol", "wire", "push"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hardware*", "adapters*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
